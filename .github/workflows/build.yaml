name: Compilar Libro_Tienda

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar el .exe
        run: >
          dotnet publish Libro_Tienda/Libro_Tienda.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o publicar

      - name: Subir el .exe
        uses: actions/upload-artifact@v4
        with:
          name: Libro_Tienda-exe
          path: publicar/Libro_Tienda.exe
